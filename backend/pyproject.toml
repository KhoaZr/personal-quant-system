[project]
name = "personal-quant-backend"
version = "0.1.0"
description = "Backend & Quant Engine for Personal Quant System"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "sqlalchemy>=2.0.28",
    "psycopg2-binary>=2.9.9",
    "pydantic>=2.6.4",
    "pydantic-settings>=2.2.1",
    "pandas>=2.2.1",
    "numpy>=1.26.4",
    "yfinance>=0.2.37",
    "scikit-learn>=1.4.1post1",
    "python-dotenv>=1.0.1",
    "alembic>=1.13.1",
    "requests>=2.31.0",
    "ta>=0.11.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "pytest>=8.1.1",
    "ruff>=0.3.3",
    "mypy>=1.9.0",
    "httpx>=0.27.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true